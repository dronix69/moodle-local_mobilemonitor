<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mobile Token Monitor">
  <title>Mobile Token Monitor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5fa8"/>
      <stop offset="1" stop-color="#0f3765"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fba33a"/>
      <stop offset="1" stop-color="#f58013"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background. -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Smartphone body. -->
  <rect x="156" y="64" width="200" height="330" rx="36" fill="#ffffff"/>
  <!-- Earpiece speaker. -->
  <rect x="232" y="88" width="48" height="9" rx="4.5" fill="#cbd5e1"/>
  <!-- Screen. -->
  <rect x="174" y="110" width="164" height="252" rx="20" fill="#e9eff7"/>
  <!-- Activity pulse on the screen (audit of mobile accesses). -->
  <polyline points="190,206 214,206 230,160 250,234 268,188 330,188"
            fill="none" stroke="#184f90" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="250,234 268,188 330,188"
            fill="none" stroke="#f98012" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shield (security and control of mobile access). -->
  <path d="M171 244 H341 V330 C341 392 306 436 256 466 C206 436 171 392 171 330 Z"
        fill="url(#shield)"/>

  <!-- Key inside the shield (the token itself is never stored). -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M226 318 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0 Z
    M243 318 a13 13 0 1 1 26 0 a13 13 0 1 1 -26 0 Z
    M249 348 h14 v64 h-14 Z
    M263 380 h24 v13 h-24 Z
    M263 400 h17 v13 h-17 Z
  "/>
</svg>
